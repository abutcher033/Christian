<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400">
  <rect width="720" height="400" fill="#f4efe6"/>
  <text x="360" y="36" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#5c3d2e">Two Ways - Psalm 1</text>
  <g font-family="Georgia, serif" fill="#1c140f">
    <rect x="50" y="70" width="280" height="250" rx="14" fill="#e7efeb" stroke="#2f5d50" stroke-width="2"/>
    <text x="190" y="110" text-anchor="middle" font-size="18" fill="#2f5d50">The blessed one</text>
    <text x="190" y="150" text-anchor="middle" font-size="15">Delight in the LORD's law</text>
    <text x="190" y="180" text-anchor="middle" font-size="15">Like a tree by water</text>
    <text x="190" y="210" text-anchor="middle" font-size="15">Fruit in its season</text>
    <text x="190" y="260" text-anchor="middle" font-size="13" fill="#6b5e52">Psalm 1:1-3</text>
    <rect x="390" y="70" width="280" height="250" rx="14" fill="#efe6d6" stroke="#8a6230" stroke-width="2"/>
    <text x="530" y="110" text-anchor="middle" font-size="18" fill="#8a6230">The wicked</text>
    <text x="530" y="150" text-anchor="middle" font-size="15">Counsel, path, and seat</text>
    <text x="530" y="180" text-anchor="middle" font-size="15">Like chaff in the wind</text>
    <text x="530" y="210" text-anchor="middle" font-size="15">They will not stand</text>
    <text x="530" y="260" text-anchor="middle" font-size="13" fill="#6b5e52">Psalm 1:1, 4-6</text>
  </g>
  <text x="360" y="360" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#5c3d2e">The LORD knows the way of the righteous (Psalm 1:6).</text>
</svg>
