<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
  <rect width="640" height="360" fill="#f4efe6"/>
  <text x="320" y="40" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#5c3d2e">Believe ’ Live (Jn 3:1618)</text>
  <rect x="60" y="100" width="220" height="180" rx="12" fill="#e7efeb" stroke="#2f5d50"/>
  <text x="170" y="190" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#2f5d50">Believe the Son</text>
  <text x="170" y="220" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#2f5d50">’ Life</text>
  <rect x="360" y="100" width="220" height="180" rx="12" fill="#f0e6e0" stroke="#8b4513"/>
  <text x="470" y="190" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#8b4513">Refuse the Son</text>
  <text x="470" y="220" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#8b4513">’ Judgment</text>
</svg>
