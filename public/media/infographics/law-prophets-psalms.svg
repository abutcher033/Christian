<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520">
  <rect width="760" height="520" fill="#f4efe6"/>
  <text x="380" y="36" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#5c3d2e">Written Concerning Him</text>
  <text x="380" y="60" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#6b5e52">Luke 24:44 - the Law of Moses, the Prophets, and the Psalms</text>
  <g font-family="Georgia, serif" font-size="12" fill="#1c140f">
    <rect x="30" y="88" width="220" height="340" rx="12" fill="#fff" stroke="#c4a35a"/>
    <text x="140" y="118" text-anchor="middle" font-size="18" fill="#5c3d2e">Law of Moses</text>
    <text x="48" y="156">Genesis 3:15 - the offspring</text>
    <text x="48" y="184">Genesis 22 - God provides</text>
    <text x="48" y="212">Exodus 12 - the Passover lamb</text>
    <text x="48" y="240">Leviticus 16 - atonement</text>
    <text x="48" y="268">Numbers 21 - the serpent</text>
    <text x="48" y="296">Deuteronomy 18 - a prophet</text>
    <text x="48" y="340" fill="#6b5e52">Jesus came to fulfill</text>
    <text x="48" y="362" fill="#6b5e52">the law (Matthew 5:17).</text>
    <rect x="270" y="88" width="220" height="340" rx="12" fill="#fff" stroke="#2f5d50"/>
    <text x="380" y="118" text-anchor="middle" font-size="18" fill="#2f5d50">Prophets</text>
    <text x="288" y="156">Isaiah 7:14 - Immanuel</text>
    <text x="288" y="184">Isaiah 53 - the Servant</text>
    <text x="288" y="212">Isaiah 61 - the Anointed</text>
    <text x="288" y="240">Micah 5:2 - Bethlehem</text>
    <text x="288" y="268">Jeremiah 31 - new covenant</text>
    <text x="288" y="296">Zechariah 9:9 - the King</text>
    <text x="288" y="340" fill="#6b5e52">He opened the Scriptures</text>
    <text x="288" y="362" fill="#6b5e52">(Luke 4:21; 24:27).</text>
    <rect x="510" y="88" width="220" height="340" rx="12" fill="#fff" stroke="#8a6230"/>
    <text x="620" y="118" text-anchor="middle" font-size="18" fill="#8a6230">Psalms</text>
    <text x="528" y="156">Psalm 2 - the Anointed</text>
    <text x="528" y="184">Psalm 16 - not to decay</text>
    <text x="528" y="212">Psalm 22 - the suffering</text>
    <text x="528" y="240">Psalm 110 - Lord and priest</text>
    <text x="528" y="268">Psalm 118 - the stone</text>
    <text x="528" y="312" fill="#6b5e52">The apostles preach</text>
    <text x="528" y="334" fill="#6b5e52">these psalms of Christ</text>
    <text x="528" y="356" fill="#6b5e52">(Acts 2:25-36).</text>
  </g>
  <text x="380" y="470" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#6b5e52">Only connections the New Testament itself draws. Read the passages.</text>
  <text x="380" y="494" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#6b5e52">Repentance and forgiveness of sins are preached in his name (Luke 24:47).</text>
</svg>
